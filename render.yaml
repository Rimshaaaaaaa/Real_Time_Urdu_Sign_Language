services:
  # Flask API Service (Dynamic backend)
  - type: web
    name: flask-api
    env: python
    plan: free  # Set plan to free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: "postgres://admin:password123@localhost:5432/mydatabase"
    regions:
      - us
    routes:
      - "/api/*"  # Route API calls to this service

  # Frontend Service (Static Site for React, Vue, or Angular)
  - type: static_site
    name: frontend
    plan: free  # Set plan to free
    buildCommand: "npm install && npm run build"  # For React/Vue/Angular
    publishDirectory: "build"  # The output directory after build (typically "build" for React)
    envVars:
      - key: NODE_ENV
        value: production
    regions:
      - us

  # Backend Database Service (PostgreSQL for backend)
  - type: database
    name: my-database
    plan: free  # Set plan to free
    dbType: postgres
    dbName: mydatabase
    envVars:
      - key: DB_HOST
        value: "localhost"
      - key: DB_USER
        value: "admin"
      - key: DB_PASSWORD
        value: "password123"
      - key: DB_NAME
        value: "mydatabase"
    regions:
      - us
