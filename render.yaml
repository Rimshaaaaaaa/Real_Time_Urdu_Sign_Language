services:

  # ======================================
  # 1) FRONTEND (React) - Served as static web
  # ======================================
  - type: web
    name: frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s build -l $PORT
    envVars:
      - key: REACT_APP_BACKEND_HOST
        value: backend-ml
      - key: REACT_APP_BACKEND_PORT
        value: $PORT

  # ======================================
  # 2) BACKEND + ML SERVICE COMBINED
  # ======================================
  - type: web
    name: backend-ml
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >
      gunicorn server:app
      --workers 2 --threads 4
      --bind 0.0.0.0:$PORT
      --timeout 120
    envVars:
      - key: MODEL_DIR
        value: ../ml_model
