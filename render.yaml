services:

  # ======================================
  # 1) EXISTING ML MODEL SERVICE
  # ======================================
  - type: web
    name: urdu-sign-api
    runtime: python
    plan: free
    rootDir: ml_model
    buildCommand: ""
    startCommand: >
      gunicorn sign_model_api:create_app
      --workers 2 --threads 4
      --bind 0.0.0.0:$PORT
      --timeout 120
    envVars:
      - key: MODEL_DIR
        value: ml_model


  # ======================================
  # 2) FRONTEND (React)
  # ======================================
  - type: web
    name: frontend
    plan: free
    rootDir: frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_HOST
        fromService:
          name: backend
          property: host
      - key: REACT_APP_BACKEND_PORT
        fromService:
          name: backend
          property: port
      - key: REACT_APP_ML_SERVICE_HOST
        fromService:
          name: urdu-sign-api
          property: host
      - key: REACT_APP_ML_SERVICE_PORT
        fromService:
          name: urdu-sign-api
          property: port


  # ======================================
  # 3) BACKEND (Flask main API)
  # ======================================
  - type: web
    name: backend
    plan: free
    rootDir: backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: ML_SERVICE_HOST
        fromService:
          name: urdu-sign-api
          property: host
      - key: ML_SERVICE_PORT
        fromService:
          name: urdu-sign-api
          property: port


  # ======================================
  # 4) ML SERVICE (Flask micro-model service)
  # ======================================
  - type: web
    name: ml-service
    plan: free
    rootDir: ml_service
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn sign_model_api:create_app --bind 0.0.0.0:$PORT
    envVars:
      - key: MODEL_DIR
        value: ../ml_model
