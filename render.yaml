services:

  # ======================================
  # 1) FRONTEND (React) - Free static site
  # ======================================
  - type: static
    name: frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_HOST
        value: backend-ml
      - key: REACT_APP_BACKEND_PORT
        value: "10000"  # optional if backend runs on default PORT

  # ======================================
  # 2) BACKEND + ML SERVICE COMBINED
  # ======================================
  - type: web
    name: backend-ml
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >
      gunicorn server:app
      --workers 2 --threads 4
      --bind 0.0.0.0:$PORT
      --timeout 120
    envVars:
      - key: MODEL_DIR
        value: ../ml_model
