services:
  # Flask API Service (Dynamic backend)
  - type: web
    name: flask-api
    runtime: python  # Set runtime to Python for Flask
    plan: free  # Set plan to free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: "YOUR_DATABASE_URL_HERE"  # Replace with actual DATABASE_URL from Render dashboard

  # Frontend Service (Static site, treated as a web service)
  - type: web  # Change from static_site to web
    name: frontend
    runtime: node  # Set runtime to Node for the frontend
    plan: free  # Set plan to free
    buildCommand: "npm install && npm run build"  # For React/Vue/Angular
    startCommand: "npm start"  # Typically, React/Vue apps use "npm start" or "serve -s build"
    envVars:
      - key: NODE_ENV
        value: production
