services:
  # Flask API Service (Dynamic backend)
  - type: web
    name: flask-api
    env: python
    plan: free  # Set plan to free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: "postgres://admin:password123@localhost:5432/mydatabase"  # Use this format for Postgres URL
    regions:
      - us
    routes:
      - "/api/*"  # Route API calls to this service

  # Frontend Service (Static site, treated as a web service)
  - type: web  # Change from static_site to web
    name: frontend
    plan: free  # Set plan to free
    buildCommand: "npm install && npm run build"  # For React/Vue/Angular
    startCommand: "npm start"  # Typically, React/Vue apps use "npm start" or "serve -s build"
    publishDirectory: "build"  # The output directory after build (typically "build" for React)
    envVars:
      - key: NODE_ENV
        value: production
    regions:
      - us

  # PostgreSQL Database Service
  - type: postgres
    name: my-database
    plan: free  # Set plan to free
    dbName: mydatabase
    envVars:
      - key: DB_HOST
        value: "localhost"
      - key: DB_USER
        value: "admin"
      - key: DB_PASSWORD
        value: "password123"
      - key: DB_NAME
        value: "mydatabase"
    regions:
      - us
