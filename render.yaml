services:
  # Flask API Service
  - type: web
    name: flask-api
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: "postgres://admin:password123@localhost:5432/mydatabase"
    regions:
      - us
    routes:
      - "/api/*"  # Any route prefixed with /api/ will be routed to this API

  # Frontend Service (React, Vue, etc.)
  - type: static_site
    name: frontend
    buildCommand: "npm install && npm run build"
    publishDirectory: "build"  # Adjust if using a different build tool
    envVars:
      - key: NODE_ENV
        value: production
    regions:
      - us

  # Backend Database Service (PostgreSQL)
  - type: database
    name: my-database
    plan: free
    dbType: postgres
    dbName: mydatabase
    envVars:
      - key: DB_HOST
        value: "localhost"
      - key: DB_USER
        value: "admin"
      - key: DB_PASSWORD
        value: "password123"
      - key: DB_NAME
        value: "mydatabase"
    regions:
      - us
